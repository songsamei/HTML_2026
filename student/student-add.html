<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
     <style>
        table, tr, td, th{
            border : 2px solid black;
            border-collapse: collapse;
            padding : 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- html. 반드시 id가 app인 태그 안에서 작업 -->
        <!-- (script 맨 하단 app.mount('#app'); 여기 아이디와 같아야 함) -->
         <div>
            <div>학번 : <input v-model = "stuNo" :disabled ="stuNoFlg">
                        <button @click = "fnGetInfo">중복체크</button>
            </div>
            <div>이름 : <input v-model = "stuName"></div>
            <div>학과 : <input v-model = "stuDept"></div>
            <div>
                <!-- <button v-if="stuNoFlg" @click = "fnAdd">추가</button></div>
                <button v-else @click = "fnAdd" disabled>추가</button></div> -->
                <button :disabled ="!stuNoFlg" @click="fnAdd">추가</button>
         </div>
    </div>
</body>
</html>

<script>
    const app = Vue.createApp({
        data() {
            return {
                // 변수 - (key : value)
                stuNo : "",
                stuName : "",
                stuDept : "",
                stuNoFlg : false
            };
        },
        methods: {
            // 함수(메소드) - (key : function())
            fnAdd: function () {
                let self = this;
                let param = {
                    stuNo : self.stuNo,
                    name : self.stuName,
                    dept : self.stuDept
                };

                $.ajax({
                    url: "http://localhost:3000/insert",
                    dataType: "json",
                    type: "GET",
                    data: param,
                    success: function (data) {
                        alert(data.result);
                    }
                });
            },
            fnGetInfo : function (){
                let self = this;
                if(self.stuNo.length != 8){
                    alert("학번은 8글자 입니다.");
                    return;
                }

                $.ajax({
                    url: "http://localhost:3000/search",
                    dataType: "json",
                    type: "GET",
                    data: {stuNo : self.stuNo},
                    success: function (data) {
                        console.log(data);
                        if(data.info == undefined || data.info == null){
                            alert("사용 가능한 학번 입니다");
                            self.stuNoFlg = true;
                        } else {
                            alert("중복된 학번 입니다.");
                        }
                    }
                }); 
            }
        }, // methods
        mounted() {
            // 처음 시작할 때 실행되는 부분
        }
    });

    app.mount('#app');
</script>
