<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #container {
            /* width: 800px; */
            border: 2px solid black;
            background-color: #eee;
            display: flex;
        }
        .box {
            width: 100px;
            margin: 10px;
            background-color: orange;
            color: white;
            text-align: center;
        }

        .flow1 {
            /* 방향이랑 wrap을 한번에 */
            flex-flow: row wrap;
        }
        .flow2 {
            flex-flow: row nowrap;
        }
    </style>
</head>
<body>
    <div id="container" class="flow2">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
    </div>
</body>
</html>
