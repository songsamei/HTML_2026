<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* div태그 다음에 오는 첫번째 p태그에 적용 */
        /* 자식 태그x 같은 레벨에 있는 형제 태그에 적용! */
        div + p {
            color: orange;
        }
        /* div태그 다음에 오는 모든 p태그에 적용 */
        /* 자식 태그x 같은 레벨에 있는 형제 태그에 적용! */
        div ~ p {
            font-weight: bold;
        }
        /* p태그 중에 id 속성을 가진 태그한테 적용 */
        p[id] {
            background-color: violet;
        }
    </style>
</head>
<body>
    <div>Hello HTML</div>
    <p>재밌다ㅎㅎ</p>
    <p id="test">즐겁다ㅎㅎㅎ</p>
    <div>
        <p>ㅎㅎ?</p>
    </div>
    <p>ㅋㅎㅋㅎ</p>
</body>
</html>
