<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>input 태그!</title>
</head>
<body>
    <fieldset>
        <legend>회원가입</legend>
        <!-- input 태그의 기본타입은 text라서 생략가능 -->
        <div>
            <label>아이디 : <input id = "userId" type="text" autofocus placeholder="아이디를 입력 해 주세요."></label>
            <input type="button" value="중복체크">
        </div>
        <div>
            <label>비밀번호 : <input id = "pwd1" type="password" placeholder="비밀번호를 입력 해 주세요."></label>
        </div>
        <div>
            <label>비밀번호 확인 : <input id = "pwd2" type="password" placeholder="비밀번호를 한번 더 입력 해 주세요."></label>
        </div>
        <div>
            <!-- 나중에 정규식으로 대체 -->
            <label>이메일 : <input id = "email" type="email"></label>
        </div>
        <div>
            성별 : 
            <label><input type="radio" name="gender" value="M">남자</label>
            <label><input type="radio" name="gender" value="F">여자</label>
        </div>
        <div>
            자기소개 :
            <div>
                <textarea id = "intro" rows="4" cols="30" placeholder="증바람 ㄱ?"></textarea>
            </div>
        </div>

        <div>
            <button onclick="fnjoin()">회원가입</button>
        </div>

    </fieldset>
</body>
</html>
