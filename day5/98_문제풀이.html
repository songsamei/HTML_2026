<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <title>Document</title>
    <style>
        table, tr, th, td {
            border: 2px solid black;
            border-collapse: collapse;
            text-align: center;
            padding: 5px 10px;
        }
    </style>
</head>
<body>
    <div id="contents"></div>
</body>
</html>
<script>
    // map 들어감. {name : "홍길동", age = 30}
    $.ajax({
        url : "https://jsonplaceholder.typicode.com/users", // 요청하고자 하는 서버 주소
        dataType : "json", // 응답 받은 데이터의 타입
        type : "GET", // 요청(호출) 방식, 대표적으로 GET, POST
        data : {}, // 서버로 보낼 값
        success : function(data){ // 서버 호출이 성공적으로 끝났을 때 실행되는 함수
            console.log(data);
            let contents = document.querySelector("#contents");
            let table = document.createElement("table");
            let tr = document.createElement("tr");
            tr.innerHTML =
                "<th>아이디</th>"
                + "<th>이름</th>"
                + "<th>이메일</th>"
                + "<th>웹사이트</th>"
            table.appendChild(tr);
            for(let i = 0 ; i < data.length; i++){
                let user = document.createElement("tr");
                user.innerHTML =
                    `<td>${data[i].id}</td>`
                    + `<td>${data[i].name}</td>`
                    + `<td>${data[i].email}</td>`
                    + `<td>${data[i].website}</td>`
                table.appendChild(user);
            }
            contents.appendChild(table);
            }
        });
</script>
