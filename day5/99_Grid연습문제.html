<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid 실습 완성본</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background-color: #f0f2f5;
      color: #333;
    }

    .box {
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px #eee;
      font-weight: bold;
      font-size: 20px;
    }
    #container {
      display: grid;
      gap: 20px;    
      grid-template-columns: 250px 1fr; 
      grid-template-rows: 150px minmax(500px, auto) 150px;
      grid-template-areas:
        "header header"
        "side contents" 
        "footer footer";
    }
    #header {
      background-color: #ff6b6b;
      color: white;
      grid-area: header; 
    }

    #header2 {
      display: flex;
      justify-content: space-between;
      margin-top: 35px;
    }
    #textValue {
      display: flex;
      justify-content: space-between;
      width: 340px;
      height: 50px;
      background-color: white;
      border-radius: 10px;
    }
    #inputText {
      width: 270px;
      height: 40px;
      background-color: white;
      border: none;
      border-radius: 10px;
      margin-top: 3px;
      margin-left: 3px;
    }
    input:focus {
    outline: none;
    }

    #btn {
      width: 60px;
      height: 40px;
      background-color: rgb(107, 129, 255);
      color: white;
      border: none;
      border-radius: 10px;
      margin-top: 5px;
      margin-right: 2px;
    }

    #side {
      background-color: #4ecdc4;
      color: white;
      grid-area: side;
    }
    #contents {
      background-color: #ccc;
      box-shadow: none;
      padding: 20px;
      grid-area: contents;
    }
    #footer {
      background-color: #45b7d1;
      color: white;
      grid-area: footer;
    }
    
    #contents{
        display: grid;
        gap: 20px;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        grid-template-rows: 150px;
    }
    .widget {
        background-color: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 3px 3px 3px #ccc;
    }
    .word {
        margin-top: 10px;
    }

    @media (max-width: 768px) {
        #container {   
        grid-template-columns: 1fr; 
        grid-template-rows: 150px 150px minmax(500px, auto) 150px;
        grid-template-areas:
            "header"
            "side"
            "contents" 
            "footer";
    }
    }
  </style>
</head>

<body>

  <div id="container">
    <div class="box" id="header">
      <div id="header2">
        <div id="logo">LOGO</div>
        <div id="textValue">
          <label><input id="inputText" type="text" placeholder="검색어를 입력하세요."></label>
          <input id="btn" type="button" value="검색">
        </div>
        <div>마이페이지</div>
      </div>
    </div>
    <div class="box" id="side">사이드영역~~</div>
    <div class="box" id="contents">
      <div class="widget">
        위젯 1<div class="word">방문자 수: 1,234명</div>
      </div>
      <div class="widget">위젯 2
        <div class="word">매출: 5,123,120원</div>
      </div>
      <div class="widget">
        위젯 3<div class="word">신규 가입: 42명</div>
      </div>
      <div class="widget">
        위젯 4<div class="word">서버 상태: 양호</div>
      </div>
      <div class="widget">
        위젯 5<div class="word">최근 알림이 없습니다.</div>
      </div>
    </div>
    <div class="box" id="footer">하단 영역~~</div>
  </div>
</body>
</html>
