<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        a {
            text-decoration: none;
        }
        /* hover -> 마우스를 올렸을 때 동작 */
        /* 꼭 a태그에서만 쓸 필요는 없습니다. */
        
        /* a:hover{
            background-color: black;
            color: white;
        } */

        /* link -> 방문하지 않은 링크에 스타일 부여 */
        a:link{
            color: rgb(255, 121, 121);
        }
        /* visited -> 방문한 링크에 스타일 부여 */
        a:visited{
            color: rgb(135, 46, 252);
        }
        /* active -> 클릭하는 순간에 스타일부여*/
        a:active{
            background-color: black;
            color: white;
        }
        /* focus -> 포커스가 되는 순간*/
        a:focus{
            background-color: aqua;
            color: white;
        }


    </style>
</head>
<body>
    <a href="https://www.naver.com">네이버</a>
    <a href="https://www.kakao.com">카카오</a>
</body>
</html>
