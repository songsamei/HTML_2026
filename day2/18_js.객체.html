<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>
        <label>첫번째 숫자 : <input id="num1"></label>
    </div>
        <div>
        <label>두번째 숫자 : <input id="num2"></label>
    </div>
    <div>
        <button onclick="fnSum()">더하기 !</button>
    </div>
    <hr>

    <div id="result">

    </div>

</body>
</html>
<script>

    function fnSum(){
        let num1 = document.querySelector("#num1").value;
        let num2 = document.querySelector("#num2").value;
        // 문자를 숫자로 바구는 함수 => parseInt, Number
        // alert(parseInt(num1) + Number(num2));

        let result = document.querySelector("#result");
        result.innerHTML = "결과 : <span style ='color:coral;'>" + (parseInt(num1) + Number(num2)) + "</b>"

        // document.write는 기존 내용이 다 사라짐.
        // document.write(parseInt(num1) + Number(num2));
    }


</script>
