<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS</title>
    <style>
        div { color: rgb(230, 90, 40); }
        #accent { font-weight: bold; }
        .bg { background-color: rgb(252, 197, 177); }
    </style>
</head>
<body>
    <!-- id는 중복 x, class 중복 o -->
    <div id="accent" class="bg">텍스트 1</div>
    <div><span class="bg">텍스트 2</span></div>
    <div>텍스트 3</div>
</body>
</html>
