<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            width: 150px;
            height: 150px;
            border: 2px solid black;
            text-align: center;
            line-height: 150px; 
            /*  line-height를 height 값이랑 동일하면 정렬됨*/
        }
        .box1 {
            background-color: rgb(255, 170, 170);
        }
        .box2 {
            background-color: rgb(156, 134, 255);
            position: relative;
            top: 30px;
            left: 50px;
        }
        .box3 {
            background-color: rgb(173, 255, 222);
            position: fixed;
            top : 100px;
            right: 50px;
        }
    </style>
</head>
<body>
    <!-- position 디폴트값은 static -->
    <!-- static은 태그 특징에 맞게 있어야할 위치에 위치되는걸 의미 -->
    <div class="box1">box1</div>

    <!-- relative는 현재 있어야할 위치(static)를 기준으로 -->
    <!-- top, bottom, left, right 값을 통해서 위치 조정 -->
    <div class="box2">box2</div>

    <!-- fixed는 좌표(x,y)와 같다 -->
    <!-- top, bottom, left, right 값을 통해서 위치 조정 -->
    <!-- 스크롤 이동해도 위치는 고정 -->
    <div class="box3">box3</div>

    <p style="margin-top: 2000px;"></p>
</body>
</html>
