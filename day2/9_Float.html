<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Float</title>
    <style>
        div {
            width: 150px;
            height: 150px;
            border: 1px solid black;
            text-align: center;
            line-height: 150px;
        }
        .box1 { 
            background-color: rgb(255, 202, 202);
            float: left;
        }
        .box2 { 
            background-color: rgb(156, 197, 255);
            float: left;
        }
        .box3 { 
            background-color: rgb(194, 156, 207);
            clear: both;
        }
    </style>
</head>
<body>
    <!-- float은 화면에 떠있는 느낌이다. -->
    <div class="box1">box1</div>
    <div class="box2">box2</div>
    <div class="box3">box3</div>
</body>
</html>
