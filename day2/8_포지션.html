<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            width: 150px;
            height: 150px;
            border: 2px solid black;
            text-align: center;
            line-height: 150px; 
            /*  line-height를 height 값이랑 동일하면 정렬됨*/
        }
        .box1 {
            background-color: rgb(255, 170, 170);
        }
        .box2 {
            background-color: rgb(156, 134, 255);
            position: absolute;
            top: 30px;
            left: 50px;
        }
        .box3 {
            background-color: rgb(173, 255, 222);
            position: absolute;
            top : 100px;
            right: 50px;
        }
    </style>
</head>
<body>
    <!-- absolute는 부모 요소에 영향을 받아서 배치 -->
    <!-- 부모 요소(태그)중에 static이 아닌 요소를 기준으로 배치 -->
    <!-- 부모 요소중에 static이 아닌 요소가 없을 경우 body 태그 기준으로 배치 -->
    <!-- 보통은 relative랑 조합해서 많이 사용 된다. -->

    <div class="box1">box1</div>
    <div class="box2">box2</div>
    
    <div style="width: 800px; height: 500px; position: relative;">
        <div class="box3">box3</div>
    </div>
</body>
</html>
