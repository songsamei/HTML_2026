<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 onclick="fnChange()" style="color: rgb(183, 183, 255); font-style: italic; cursor: pointer;" id = "txt">JAVASCRIPT 재밌누</h1>
</body>
</html>
<script>
    function fnChange(){
        let obj = document.querySelector("#txt");
        if(obj.style.color == "rgb(183, 183, 255)"){
            obj.style.color = "rgb(99, 99, 255)";
            obj.style.fontStyle = "normal";
        } else {
            obj.style.color = "rgb(183, 183, 255)";
            obj.style.fontStyle = "italic";
        }
    }
    
</script>
