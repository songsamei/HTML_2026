<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>
        <label><input type="checkbox" name="subject" value="HTML">HTML</label>
        <label><input type="checkbox" name="subject" value="ORACLE">ORACLE</label>
        <label><input type="checkbox" name="subject" value="JAVA">JAVA</label>
        <label><input type="checkbox" name="subject" value="JQUERY">JQUERY</label>
        <button onclick="fnSubject">클릭!</button>
    </div>
    <div id="imgList"></div>
</body>
</html>
<script>
    function fnSubject(){
        let subject = document.querySelectorAll("input[name='subject']:checked").value;
        let imgList = document.querySelector("#imageList");
        for(let i = 0 ; i<subject.length; i++){
            imgList.innerHTML += `<img src = '../images/${subject[i].value}.jpg'>`
        }
    }
</script>
