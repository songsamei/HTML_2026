<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            width: 500px;
            height: 500px;
        }
        .grad {
            /* 반복 */
            background: blue; /* 그라데이션을 지원 해 주지 않는 브라우저에게 보여주는 색상이다. */
            background:repeating-linear-gradient(orange, yellowgreen 20%)
        }
        .grad2 {
            background: blue; /* 그라데이션을 지원 해 주지 않는 브라우저에게 보여주는 색상이다. */
            background:repeating-radial-gradient(rgb(236, 179, 72), rgb(226, 255, 167) 20%)
        }
    </style>
</head>
<body>
    <div class="grad2"></div>
</body>
</html>
