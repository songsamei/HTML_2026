<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            width: 500px;
            height: 500px;
        }
        .grad {
            background: blue; /* 그라데이션을 지원 해 주지 않는 브라우저에게 보여주는 색상이다. */
            background:radial-gradient(white, rgb(70, 103, 253), rgb(51, 51, 255));
        }
        .grad2 {
            background: blue; 
            background:linear-gradient(45deg, rgb(70, 103, 253), white);
        }
        .grad3 {
            background: blue;
            background:radial-gradient(circle, white, yellow, orange);
        }
        .grad4 {
            background: blue;
            background:radial-gradient(circle at 20% 50%, white, yellow, orange);
        }
        .grad5 {
            background: blue;
            background:radial-gradient(white 10%, yellow 56%, orange 88%);
        }
    </style>
</head>
<body>
    <div class="grad5"></div>
</body>
</html>
