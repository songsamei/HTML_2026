<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
    <div id="app">
        <!-- html. 반드시 id가 app인 태그 안에서 작업 -->
        <!-- (script 맨 하단 app.mount('#app'); 여기 아이디와 같아야 함) -->
         <div>
            아이디 : <input v-model="userId">
            <div v-if="userId != ''" style="margin-left: 60px;">
                <span v-if="userId.length < 5" style="font-size: 10px; color: red; font-weight: bold;"> 아이디는 5글자 이상 </span>
                <span v-else style="font-size: 10px; color: blue; font-weight: bold;">사용가능</span>
            </div>
         </div>
         <div>
            비밀번호 : <input type="password" v-model="psw1">
         </div>
        <div>
            비밀번호 확인 : <input type="password" v-model="psw2">
         </div>
         <div>
            <button @click="fnJoin">가입!</button>
         </div>
</body>
</html>

<script>
    const app = Vue.createApp({
        data() {
            return {
                // 변수 - (key : value)
                userId : "",
                pwd1 : "",
                pwd2 : ""
            };
        },
        methods: {
            // 함수(메소드) - (key : function())
            fnJoin: function () {
                let self = this;
                if(self.userId == '' || self.pwd1 == '' || self.pwd2 == ''){
                    alert("모든 값을 채워주세요!");
                    return;
                }
            }
        }, // methods
        mounted() {
            // 처음 시작할 때 실행되는 부분
        }
    });

    app.mount('#app');
</script>
