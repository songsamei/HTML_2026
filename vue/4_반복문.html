    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

<body>
    <div id="app">

        <!-- (script 맨 하단 app.mount('#app'); 여기 아이디와 같아야 함) -->
         <div v-for="item in numList">
            <span v-if= "item >= 3" style = "color: blue;">{{item}}</span>
            <span v-else>{{item}}</span>
         </div>
         <hr>
         <div v-for="(item, index) in numList">
            {{index+1}}. {{item}}
         </div>

         <hr>
         <table>
            <tr>
                <th>No.</th>

                <th>주소</th>
            </tr>
            <tr v-for="(item, index) in jsonData">
                <td>{{index+1}}</td>
                <td>{{item.name}}</td>
                <td>{{item.addr}}</td>
            </tr>
         </table>
    </div>
</body>
</html>
